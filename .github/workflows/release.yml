name: Build Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install build dependencies
        run: python -m pip install ".[build]"
      - name: Test
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Build
        run: python -m PyInstaller --noconfirm --clean JianpuPlayerNext.spec
      - uses: actions/upload-artifact@v4
        with:
          name: JianpuPlayerNext-Windows
          path: dist/JianpuPlayerNext-*.exe
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $asset = Get-ChildItem dist/JianpuPlayerNext-*.exe | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $asset) { throw "Release asset was not created" }
          $tag = $env:GITHUB_REF_NAME
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $asset.FullName --clobber
          } else {
            gh release create $tag $asset.FullName --generate-notes
          }
